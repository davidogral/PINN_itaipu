[package]
name = "pgnn-itaipu"
version = "0.1.0"
edition = "2021"
description = "Rede neural guiada por física, implementada do zero em Rust, para a geração diária de Itaipu"
license = "MIT"
repository = "https://github.com/davidogral/PGNN_itaipu"
publish = false

# Implementação do zero: SEM bibliotecas de Machine Learning ou
# diferenciação automática. Apenas serialização/leitura de dados.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"
serde_json = "1.0"
